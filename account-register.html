<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | SneakerSpace</title>
    <link rel="stylesheet" href="assets/css/styles.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    <style>
        .auth-page{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--background);padding:2rem}
        .auth-card{background:var(--card-bg);border:1px solid var(--border-color);border-radius:20px;padding:2.5rem;max-width:420px;width:100%;box-shadow:0 0 40px rgba(139,92,246,0.15)}
        .auth-card h1{font-size:1.8rem;text-align:center;margin-bottom:0.5rem;color:var(--text-primary)}
        .auth-card .subtitle{text-align:center;color:var(--text-secondary);margin-bottom:2rem}
        .auth-card .brand{text-align:center;margin-bottom:2rem}
        .auth-card .brand a{color:var(--primary);font-size:1.5rem;font-weight:700;text-decoration:none}
        .auth-form .form-group{margin-bottom:1.25rem}
        .auth-form label{display:block;margin-bottom:0.5rem;color:var(--text-secondary);font-weight:500;font-size:0.9rem}
        .auth-form input{width:100%;padding:0.875rem 1rem;background:var(--background);border:1px solid var(--border-color);border-radius:10px;color:var(--text-primary);font-size:1rem}
        .auth-form input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 15px rgba(139,92,246,0.2)}
        .auth-submit{width:100%;padding:1rem;background:linear-gradient(135deg,#8b5cf6,#06b6d4);border:none;border-radius:25px;color:#fff;font-size:1rem;font-weight:600;cursor:pointer;margin-top:0.5rem;display:flex;align-items:center;justify-content:center;gap:0.5rem;transition:all 0.3s}
        .auth-submit:hover{transform:translateY(-2px);box-shadow:0 0 30px rgba(139,92,246,0.4)}
        .auth-submit:disabled{opacity:0.7;cursor:not-allowed;transform:none}
        .auth-links{text-align:center;margin-top:1.5rem;color:var(--text-secondary)}
        .auth-links a{color:var(--primary);text-decoration:none;font-weight:600}
        .auth-error{background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.3);color:#ef4444;padding:0.75rem;border-radius:10px;margin-bottom:1rem;text-align:center;display:none}
        .form-row{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
        .back-link{position:absolute;top:1.5rem;left:1.5rem}
        .back-link a{color:var(--text-secondary);text-decoration:none;display:flex;align-items:center;gap:0.5rem;transition:color 0.3s}
        .back-link a:hover{color:var(--primary)}
    </style>
</head>
<body>
    <div class="back-link"><a href="home.html"><i class="fas fa-arrow-left"></i> Back to Store</a></div>
    <div class="auth-page">
        <div class="auth-card">
            <div class="brand"><a href="home.html">🚀 SneakerSpace</a></div>
            <h1>Create Account</h1>
            <p class="subtitle">Join SneakerSpace to start shopping</p>
            <div class="auth-error" id="authError"></div>
            <form class="auth-form" id="registerForm">
                <div class="form-group">
                    <label>Full Name *</label>
                    <input type="text" name="name" required placeholder="John Doe" minlength="2">
                </div>
                <div class="form-group">
                    <label>Email Address *</label>
                    <input type="email" name="email" required placeholder="you@example.com">
                </div>
                <div class="form-group">
                    <label>Phone Number</label>
                    <input type="tel" name="phone" placeholder="+254 712 345 678">
                </div>
                <div class="form-group">
                    <label>Password * (min 6 characters)</label>
                    <input type="password" name="password" required minlength="6" placeholder="Create a password">
                </div>
                <div class="form-group">
                    <label>Confirm Password *</label>
                    <input type="password" name="confirm" required placeholder="Confirm your password">
                </div>
                <button type="submit" class="auth-submit" id="submitBtn">
                    <i class="fas fa-user-plus"></i> Create Account
                </button>
            </form>
            <p class="auth-links">Already have an account? <a href="account-login.html">Sign in</a></p>
        </div>
    </div>
    <script>
        document.getElementById('registerForm').addEventListener('submit', async(e)=>{
            e.preventDefault();
            const btn=document.getElementById('submitBtn');
            const err=document.getElementById('authError');
            const fd=new FormData(e.target);
            const data=Object.fromEntries(fd);
            if(data.password!==data.confirm){err.textContent='Passwords do not match';err.style.display='block';return}
            btn.innerHTML='<i class="fas fa-spinner fa-spin"></i> Creating account...';btn.disabled=true;err.style.display='none';
            try{
                const r=await fetch('/api/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
                const d=await r.json();
                if(!r.ok)throw new Error(d.error||'Registration failed');
                window.location.href='account.html';
            }catch(ex){
                err.textContent=ex.message;err.style.display='block';
                btn.innerHTML='<i class="fas fa-user-plus"></i> Create Account';btn.disabled=false;
            }
        });
    </script>
</body>
</html>
