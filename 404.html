<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 Page Not Found | SneakerSpace</title>
  <link rel="stylesheet" href="assets/css/styles.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
  <script src="assets/js/theme.js" defer></script>
</head>
<body style="display:flex; align-items:center; justify-content:center; min-height:100vh; text-align:center; padding:2rem; background:var(--background); color:var(--text);">
  <div style="max-width:500px;">
    <div style="font-size:6rem; margin-bottom:1rem; opacity:0.3; color:var(--primary);">
      <i class="fas fa-shoe-prints"></i>
    </div>
    <h1 style="font-size:3rem; margin-bottom:0.5rem; font-weight:800;">404</h1>
    <h2 style="font-size:1.5rem; margin-bottom:1rem;">Page Not Found</h2>
    <p style="color:var(--text-secondary); margin-bottom:2rem; line-height:1.6;">
      Looks like you've stepped out of bounds. The page you're looking for doesn't exist or has moved.
    </p>
    <div style="display:flex; gap:1rem; justify-content:center; flex-wrap:wrap;">
      <a href="home.html" class="primary-btn" style="padding:0.8rem 1.8rem; text-decoration:none; display:inline-flex; align-items:center; gap:0.5rem;">
        <i class="fas fa-home"></i> Go to Home
      </a>
      <a href="shop.html" class="secondary-btn" style="padding:0.8rem 1.8rem; text-decoration:none; display:inline-flex; align-items:center; gap:0.5rem; border:1px solid var(--border-color); border-radius:10px; color:var(--text);">
        <i class="fas fa-shopping-bag"></i> Browse Shop
      </a>
    </div>
  </div>
</body>
</html>
