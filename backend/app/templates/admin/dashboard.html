{% extends "admin/base.html" %}
{% block content %}
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1>Product Dashboard</h1>
        <a href="{{ url_for('add_product') }}" class="btn btn-primary">Add New Product</a>
    </div>
    <table class="table table-striped">
        <thead>
            <tr>
                <th>Image</th>
                <th>Name</th>
                <th>Category</th>
                <th>Price</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for product in products %}
            <tr>
                <td><img src="{{ product.image_url }}" alt="{{ product.name }}" width="50"></td>
                <td>{{ product.name }}</td>
                <td>{{ product.category }}</td>
                <td>Ksh {{ "%.2f"|format(product.price) }}</td>
                <td>
                    <a href="{{ url_for('edit_product', product_id=product.id) }}" class="btn btn-secondary btn-sm">Edit</a>
                    <form action="{{ url_for('delete_product', product_id=product.id) }}" method="POST" class="d-inline">
                        <input type="submit" value="Delete" class="btn btn-danger btn-sm" onclick="return confirm('Are you sure you want to delete this product?');">
                    </form>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
{% endblock %}
